networks:
  raft-net:
    name: raft-net
    driver: bridge

services:
  cli-client:
    build: .
    entrypoint: ["./raft-cli"] 
    container_name: cli-client
    profiles: ["client"]
    networks:
      - raft-net
    environment:
     - PEERS=1=node1:50051,2=node2:50051,3=node3:50051,4=node4:50051,5=node5:50051
  node1:    
    build: .
    command: ./raft-node
    image: raft-node
    container_name: node1
    networks:
      raft-net:
        aliases:
          - raft
    environment:
      - NODE_ID=1
      - ROLE=voter
      - ADDRESS=node1:50051
      - PEERS=2=node2:50051,3=node3:50051,4=node4:50051,5=node5:50051
    ports:
      - "8001:50051"

  node2:
    build: .
    command: ./raft-node
    image: raft-node
    container_name: node2
    networks:
      raft-net:
        aliases:
          - raft
    environment:
      - NODE_ID=2
      - ROLE=voter
      - ADDRESS=node2:50051
      - PEERS=1=node1:50051,3=node3:50051,4=node4:50051,5=node5:50051
    ports:
      - "8002:50051"

  node3:
    build: .
    command: ./raft-node
    image: raft-node
    container_name: node3
    networks:
      raft-net:
        aliases:
          - raft
    environment:
      - NODE_ID=3
      - ROLE=voter
      - ADDRESS=node3:50051
      - PEERS=1=node1:50051,2=node2:50051,4=node4:50051,5=node5:50051
    ports:
      - "8003:50051"

  node4:
    build: .
    command: ./raft-node
    image: raft-node
    container_name: node4
    networks:
      raft-net:
        aliases:
          - raft
    environment:
      - NODE_ID=4
      - ROLE=voter
      - ADDRESS=node4:50051
      - PEERS=1=node1:50051,2=node2:50051,3=node3:50051,5=node5:50051
    ports:
      - "8004:50051"

  node5:
    build: .
    command: ./raft-node
    image: raft-node
    container_name: node5
    networks:
      raft-net:
        aliases:
          - raft
    environment:
     - NODE_ID=5
     - ROLE=voter
     - ADDRESS=node5:50051
     - PEERS=1=node1:50051,2=node2:50051,3=node3:50051,4=node4:50051
    ports:
     - "8005:50051"

